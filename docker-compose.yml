
services:
  kubesdk:
    build:
      context: .
      dockerfile: Dockerfile
    image: kubesdk:latest
    container_name: kubesdk-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - KUBECONFIG=/kubeconfig/kubeconfig.yaml
      - K8S_API_SERVER_URL=https://k3s:6443
      - K8S_TOKEN_FILE=/kubeconfig/token
    volumes:
      - ./kubeconfig:/kubeconfig
    depends_on:
      k3s:
        condition: service_healthy

  k3s:
    image: rancher/k3s:v1.28.2-k3s1
    container_name: kubesdk-k3s-cluster
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Start k3s server in the background
        /bin/k3s server --tls-san=k3s --tls-san=localhost --write-kubeconfig-mode=644 &
        K3S_PID=$$!

        # Wait for the API server to be ready
        echo "Waiting for API server to become ready..."
        until kubectl get --raw /readyz >/dev/null 2>&1; do
          sleep 2
        done
        echo "API server is ready. Setting up KubeSDK credentials..."

        # Create service account and bind cluster-admin role
        kubectl create serviceaccount kubesdk --dry-run=client -o yaml | kubectl apply -f -
        kubectl create clusterrolebinding kubesdk-admin --clusterrole=cluster-admin --serviceaccount=default:kubesdk --dry-run=client -o yaml | kubectl apply -f -

        # Generate token and save to token file in the shared directory
        kubectl create token kubesdk --duration=87600h > /kubeconfig/token
        echo "KubeSDK token successfully written to /kubeconfig/token."

        # Generate internal kubeconfig pointing to k3s endpoint inside docker network
        sed 's/127.0.0.1/k3s/g' /kubeconfig/kubeconfig.yaml > /kubeconfig/kubeconfig-internal.yaml
        echo "Internal kubeconfig generated."

        # Keep container alive and wait for K3s process to exit
        wait $$K3S_PID
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "6443:6443"
    environment:
      - K3S_KUBECONFIG_OUTPUT=/kubeconfig/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./kubeconfig:/kubeconfig
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  headlamp:
    image: ghcr.io/headlamp-k8s/headlamp:latest
    container_name: kubesdk-headlamp
    ports:
      - "4466:4466"
    volumes:
      - ./kubeconfig:/kubeconfig
    environment:
      - KUBECONFIG=/kubeconfig/kubeconfig-internal.yaml
    depends_on:
      k3s:
        condition: service_healthy

volumes:
  k3s-data:
