    infra.example.com/profile: sdk
    pod-template-hash: 7d8c5c4648
  annotations:
    infra.example.com/id: kafka
    infra.example.com/category: application
    infra.example.com/kind: workload
    infra.example.com/source-kind: Pod
spec:
  volumes: []
  containers:
    - name: kafka
      image: ghcr.io/bitnami/kafka:3.7.0
      imagePullPolicy: Always
      env:
        - name: ALLOW_PLAINTEXT_LISTENER
          value: 'yes'
        - name: KAFKA_CFG_LISTENERS
          value: PLAINTEXT://:9092
        - name: KAFKA_CFG_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka.platform.svc.cluster.local:9092
      envFrom: []
      volumeMounts: []
      ports:
        - containerPort: 9092
          protocol: TCP
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi

