      ha_recommendation: Deploy with Oracle RAC for HA.
      languages:
        java:
          frameworks:
            - Spring Boot
          sample_code: samples/java/database/sql/oracle/sample.yaml
          config_template: samples/java/database/sql/oracle/config.mustache
