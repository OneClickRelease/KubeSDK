dependencies:
  Airflow DAGs:
    pip: apache airflow-client>=1.0.0
    poetry: '[tool.poetry.dependencies]

      python = "^3.9"

      apache airflow-client = "^1.0.0"'
    setuptools: apache airflow-client>=1.0.0
envVars:
- key: SERVICE_HOST
  value: '{{host}}'
- key: SERVICE_PORT
  value: '{{port}}'
- key: SERVICE_USER
  value: '{{username}}'
- key: SERVICE_KEY
  value: '{{password}}'
