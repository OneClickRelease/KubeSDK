dependencies:
  google-cloud-bigquery:
    pip: google bigquery-client>=1.0.0
    poetry: '[tool.poetry.dependencies]

      python = "^3.9"

      google bigquery-client = "^1.0.0"'
    setuptools: google bigquery-client>=1.0.0
envVars:
- key: SERVICE_HOST
  value: '{{host}}'
- key: SERVICE_PORT
  value: '{{port}}'
- key: SERVICE_USER
  value: '{{username}}'
- key: SERVICE_KEY
  value: '{{password}}'
