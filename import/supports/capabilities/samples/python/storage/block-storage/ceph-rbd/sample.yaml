dependencies:
  FastAPI:
    pip: ceph rbd-client>=1.0.0
    poetry: '[tool.poetry.dependencies]

      python = "^3.9"

      ceph rbd-client = "^1.0.0"'
    setuptools: ceph rbd-client>=1.0.0
envVars:
- key: SERVICE_HOST
  value: '{{host}}'
- key: SERVICE_PORT
  value: '{{port}}'
- key: SERVICE_USER
  value: '{{username}}'
- key: SERVICE_KEY
  value: '{{password}}'
