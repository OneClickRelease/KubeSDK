dependencies:
  Boto3:
    pip: aws secrets manager-client>=1.0.0
    poetry: '[tool.poetry.dependencies]

      python = "^3.9"

      aws secrets manager-client = "^1.0.0"'
    setuptools: aws secrets manager-client>=1.0.0
envVars:
- key: VAULT_ADDR
  value: http://{{host}}:{{port}}
- key: VAULT_TOKEN
  value: '{{password}}'
