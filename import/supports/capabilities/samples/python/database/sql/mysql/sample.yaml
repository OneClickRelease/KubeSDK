dependencies:
  Django ORM:
    pip: mysqlclient>=2.2.0
    poetry: '[tool.poetry.dependencies]

      python = "^3.9"

      mysqlclient = "^2.2.0"'
    setuptools: mysqlclient>=2.2.0
  SQLAlchemy:
    pip: mysqlclient>=2.2.0
    poetry: '[tool.poetry.dependencies]

      python = "^3.9"

      mysqlclient = "^2.2.0"'
    setuptools: mysqlclient>=2.2.0
envVars:
- key: DB_HOST
  value: '{{host}}'
- key: DB_PORT
  value: '{{port}}'
- key: DB_NAME
  value: '{{database}}'
- key: DB_USER
  value: '{{username}}'
- key: DB_PASS
  value: '{{password}}'
