dependencies:
  Spring Boot:
    maven: "<dependency>\n    <groupId>org.example</groupId>\n    <artifactId>rest\
      \ api-client</artifactId>\n    <version>1.0.0</version>\n</dependency>"
    gradle: implementation 'org.example:rest api-client:1.0.0'
    ant: '<!-- Ant dependency for REST API -->

      <ivy:dependency org="org.example" name="rest api-client" rev="1.0.0"/>'
  Micronaut:
    maven: "<dependency>\n    <groupId>org.example</groupId>\n    <artifactId>rest\
      \ api-client</artifactId>\n    <version>1.0.0</version>\n</dependency>"
    gradle: implementation 'org.example:rest api-client:1.0.0'
    ant: '<!-- Ant dependency for REST API -->

      <ivy:dependency org="org.example" name="rest api-client" rev="1.0.0"/>'
envVars:
- key: SERVICE_HOST
  value: '{{host}}'
- key: SERVICE_PORT
  value: '{{port}}'
- key: SERVICE_USER
  value: '{{username}}'
- key: SERVICE_KEY
  value: '{{password}}'
