dependencies:
  JacORB:
    maven: "<dependency>\n    <groupId>org.example</groupId>\n    <artifactId>corba-client</artifactId>\n\
      \    <version>1.0.0</version>\n</dependency>"
    gradle: implementation 'org.example:corba-client:1.0.0'
    ant: '<!-- Ant dependency for CORBA -->

      <ivy:dependency org="org.example" name="corba-client" rev="1.0.0"/>'
  OpenORB:
    maven: "<dependency>\n    <groupId>org.example</groupId>\n    <artifactId>corba-client</artifactId>\n\
      \    <version>1.0.0</version>\n</dependency>"
    gradle: implementation 'org.example:corba-client:1.0.0'
    ant: '<!-- Ant dependency for CORBA -->

      <ivy:dependency org="org.example" name="corba-client" rev="1.0.0"/>'
envVars:
- key: SERVICE_HOST
  value: '{{host}}'
- key: SERVICE_PORT
  value: '{{port}}'
- key: SERVICE_USER
  value: '{{username}}'
- key: SERVICE_KEY
  value: '{{password}}'
