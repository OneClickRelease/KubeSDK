dependencies:
  Spring Vault:
    maven: "<dependency>\n    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-vault-config</artifactId>\n\
      </dependency>"
    gradle: implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
    ant: '<!-- Ant dependency for HashiCorp Vault -->

      <ivy:dependency org="org.example" name="hashicorp vault-client" rev="1.0.0"/>'
envVars:
- key: VAULT_ADDR
  value: http://{{host}}:{{port}}
- key: VAULT_TOKEN
  value: '{{password}}'
