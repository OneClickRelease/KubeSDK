dependencies:
  Spring Boot:
    maven: "<dependency>\n    <groupId>org.postgresql</groupId>\n    <artifactId>postgresql</artifactId>\n\
      \    <scope>runtime</scope>\n</dependency>\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
      \    <artifactId>spring-boot-starter-data-jpa</artifactId>\n</dependency>"
    gradle: 'runtimeOnly ''org.postgresql:postgresql''

      implementation ''org.springframework.boot:spring-boot-starter-data-jpa'''
    ant: '<!-- Ant dependency for PostgreSQL -->

      <ivy:dependency org="org.example" name="postgresql-client" rev="1.0.0"/>'
  Micronaut:
    maven: "<dependency>\n    <groupId>org.postgresql</groupId>\n    <artifactId>postgresql</artifactId>\n\
      \    <scope>runtime</scope>\n</dependency>\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
      \    <artifactId>spring-boot-starter-data-jpa</artifactId>\n</dependency>"
    gradle: 'runtimeOnly ''org.postgresql:postgresql''

      implementation ''org.springframework.boot:spring-boot-starter-data-jpa'''
    ant: '<!-- Ant dependency for PostgreSQL -->

      <ivy:dependency org="org.example" name="postgresql-client" rev="1.0.0"/>'
envVars:
- key: DB_HOST
  value: '{{host}}'
- key: DB_PORT
  value: '{{port}}'
- key: DB_NAME
  value: '{{database}}'
- key: DB_USER
  value: '{{username}}'
- key: DB_PASS
  value: '{{password}}'
