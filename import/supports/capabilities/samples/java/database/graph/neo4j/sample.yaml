dependencies:
  Spring Data Neo4j:
    maven: "<dependency>\n    <groupId>org.example</groupId>\n    <artifactId>neo4j-client</artifactId>\n\
      \    <version>1.0.0</version>\n</dependency>"
    gradle: implementation 'org.example:neo4j-client:1.0.0'
    ant: '<!-- Ant dependency for Neo4j -->

      <ivy:dependency org="org.example" name="neo4j-client" rev="1.0.0"/>'
envVars:
- key: SERVICE_HOST
  value: '{{host}}'
- key: SERVICE_PORT
  value: '{{port}}'
- key: SERVICE_USER
  value: '{{username}}'
- key: SERVICE_KEY
  value: '{{password}}'
