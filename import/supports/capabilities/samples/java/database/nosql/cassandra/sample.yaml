dependencies:
  Spring Boot:
    maven: "<dependency>\n    <groupId>org.example</groupId>\n    <artifactId>cassandra-client</artifactId>\n\
      \    <version>1.0.0</version>\n</dependency>"
    gradle: implementation 'org.example:cassandra-client:1.0.0'
    ant: '<!-- Ant dependency for Cassandra -->

      <ivy:dependency org="org.example" name="cassandra-client" rev="1.0.0"/>'
envVars:
- key: SERVICE_HOST
  value: '{{host}}'
- key: SERVICE_PORT
  value: '{{port}}'
- key: SERVICE_USER
  value: '{{username}}'
- key: SERVICE_KEY
  value: '{{password}}'
