secrets:
  parent: Security
  providers:

    - name: HashiCorp Vault
      description: Secrets management, encryption, and identity-based access for applications and infrastructure.
      image_url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/hashicorp.svg"
      website_url: "https://www.vaultproject.io"
      repo_url: "https://github.com/hashicorp/vault"
      documentation_url: "https://developer.hashicorp.com/vault/docs"
      version: "v1"
      latest_version: "1.17.0"
      license_conditions: "MPL 2.0 for OSS; commercial enterprise edition available."
      protocols_supported: [HTTP, REST]
      default_ports: [8200]
      resources:
        vcpu: "2"
        memory: "4Gi"
        disk: "20Gi"
      dependencies: ["Consul or Raft storage backend", "TLS certificates"]
      ha_recommendation: "Deploy Vault in HA mode with 3+ nodes and integrated storage."
      languages:
        python:
          frameworks: [hvac]
          sample_code: "samples/python/security/secrets/vault/sample.yaml"
          config_template: "samples/python/security/secrets/vault/config.mustache"
        java:
          frameworks: [Spring Vault]
          sample_code: "samples/java/security/secrets/vault/sample.yaml"
          config_template: "samples/java/security/secrets/vault/config.mustache"

    - name: AWS Secrets Manager
      description: Managed service for storing and retrieving application secrets in AWS.
      image_url: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/amazonwebservices.svg"
      website_url: "https://aws.amazon.com/secrets-manager/"
      repo_url: ""
      documentation_url: "https://docs.aws.amazon.com/secretsmanager/"
      version: "v1"
      latest_version: "2026.1"
      license_conditions: "Proprietary AWS service."
      protocols_supported: [HTTPS, REST]
      default_ports: [443]
      resources:
        vcpu: "N/A (cloud managed)"
        memory: "N/A (cloud managed)"
        disk: "N/A (cloud managed)"
      dependencies: ["AWS account", "IAM roles configured"]
      ha_recommendation: "Cloud-managed HA by AWS."
      languages:
        python:
          frameworks: [Boto3]
          sample_code: "samples/python/security/secrets/aws-secrets/sample.yaml"
          config_template: "samples/python/security/secrets/aws-secrets/config.mustache"
